name: Release Preflight

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 45
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode 26
      run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

    - name: Validate metadata and analyze release builds
      run: ./release_preflight.sh
