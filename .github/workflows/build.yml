name: Release Preflight

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 45
    
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      with:
        persist-credentials: false

    - name: Select Xcode 26
      run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

    - name: Validate metadata and analyze release builds
      run: ./release_preflight.sh
